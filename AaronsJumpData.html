<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aaron's Jump Data</title>

  <link rel="icon" href="/imgs/JumpDataIcon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/aarons-jump-data-styles/AaronsJumpData.css" />
</head>

<body>

  <!-- NAV -->
  <div class="nav-tabs">
    <a href="index.html">Space Trucker Tools</a>
    <a href="CargoManifestWriter.html">Cargo Manifest Writer</a>
    <a href="WorkordersOverview.html">Work Orders Overview</a>
    <a href="ProfitSplitter.html">Profit Splitter</a>
    <a href="Yield2Sell.html">Yield 2 Sell</a>
    <a href="Scavenger.html">Scavenger</a>
    <a href="AaronsJumpData.html" class="active">Aaron's Jump Data</a>
    <a href="Profile.html">Profile</a>
  </div>

  <!-- CONTENT -->
  <div class="container">
    <h1>Quantum Jump Data — Aaron’s Halo</h1>

    <!-- SELECTORS -->
    <div class="controls">
      <label>
        System:
        <select id="systemSelect"></select>
      </label>

      <label>
        Start Point:
        <select id="startSelect"></select>
      </label>
    </div>

    <!-- TABLE -->
    <table id="jumpTable">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- DATA -->
  <script src="JumpData.js"></script>

  <!-- LOGIC -->
  <script>
    const systemSelect = document.getElementById("systemSelect");
    const startSelect = document.getElementById("startSelect");
    const thead = document.querySelector("#jumpTable thead");
    const tbody = document.querySelector("#jumpTable tbody");

    function initSelectors() {
      systemSelect.innerHTML = "";

      Object.keys(JumpData).forEach(system => {
        const option = document.createElement("option");
        option.value = system;
        option.textContent = system;
        systemSelect.appendChild(option);
      });

      systemSelect.addEventListener("change", updateStartPoints);
      startSelect.addEventListener("change", buildMatrix);

      updateStartPoints();
    }

    function updateStartPoints() {
      const system = systemSelect.value;
      startSelect.innerHTML = "";

      Object.keys(JumpData[system]).forEach(start => {
        const option = document.createElement("option");
        option.value = start;
        option.textContent = start;
        startSelect.appendChild(option);
      });

      buildMatrix();
    }

    function buildMatrix() {
      const system = systemSelect.value;
      const start = startSelect.value;
      const routes = JumpData[system][start];

      thead.innerHTML = "";
      tbody.innerHTML = "";

      const endpoints = Object.keys(routes);

      /* HEADER ROW */
      const headerRow = document.createElement("tr");
      headerRow.innerHTML = `<th>${start}</th>`;
      endpoints.forEach(end => {
        headerRow.innerHTML += `<th>${end}</th>`;
      });
      thead.appendChild(headerRow);

      /* DISTANCE ROW */
      const distanceRow = document.createElement("tr");
      distanceRow.innerHTML = `<td>Distance (mil km)</td>`;
      endpoints.forEach(end => {
        distanceRow.innerHTML += `<td class="highlight">${routes[end].distance}</td>`;
      });
      tbody.appendChild(distanceRow);

      /* REVERSE ROW */
      const reverseRow = document.createElement("tr");
      reverseRow.innerHTML = `<td>Reverse</td>`;
      endpoints.forEach(end => {
        reverseRow.innerHTML += `<td>${routes[end].reverse}</td>`;
      });
      tbody.appendChild(reverseRow);
    }

    initSelectors();
  </script>

</body>
</html>
