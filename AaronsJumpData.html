</head>

<body>

  <!-- NAV -->
  <div class="nav-tabs">
    <a href="index.html">Space Trucker Tools</a>

  <!-- CONTENT -->
  <div class="container">
    <h1>Quantum Jump Data — Aaron’s Halo</h1>

    <div id="tables"></div>
  </div>

  <!-- DATA -->
  <script src="JumpData.js"></script>

  <!-- LOGIC -->
  <script>
    const tablesContainer = document.getElementById("tables");

    function buildAllTables() {
      for (const system in JumpData) {
        const systemHeader = document.createElement("h2");
        systemHeader.textContent = system;
        systemHeader.className = "system-title";
        tablesContainer.appendChild(systemHeader);

        for (const start in JumpData[system]) {
          const startHeader = document.createElement("h3");
          startHeader.textContent = start;
          startHeader.className = "start-title";
          tablesContainer.appendChild(startHeader);

          const table = document.createElement("table");
          table.className = "jump-matrix";

          const thead = document.createElement("thead");
          const tbody = document.createElement("tbody");

          const endpoints = Object.keys(JumpData[system][start]);

          /* HEADER ROW */
          const headerRow = document.createElement("tr");
          headerRow.innerHTML = `<th>${start}</th>`;
          endpoints.forEach(end => {
            headerRow.innerHTML += `<th>${end}</th>`;
          });
          thead.appendChild(headerRow);

          /* DISTANCE ROW */
          const distanceRow = document.createElement("tr");
          distanceRow.innerHTML = `<td>Distance (mil km)</td>`;
          endpoints.forEach(end => {
            const value = JumpData[system][start][end].distance;
            distanceRow.innerHTML += `<td class="highlight">${value}</td>`;
          });
          tbody.appendChild(distanceRow);

          /* REVERSE ROW */
          const reverseRow = document.createElement("tr");
          reverseRow.innerHTML = `<td>Reverse</td>`;
          endpoints.forEach(end => {
            const value = JumpData[system][start][end].reverse;
            reverseRow.innerHTML += `<td>${value}</td>`;
          });
          tbody.appendChild(reverseRow);

          table.appendChild(thead);
          table.appendChild(tbody);
          tablesContainer.appendChild(table);
        }
      }
    }

    buildAllTables();
  </script>

</body>
</html>
