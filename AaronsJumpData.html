<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aaron's Jump Data</title>

  <link rel="icon" href="/imgs/JumpDataIcon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/aarons-jump-data-styles/AaronsJumpData.css" />
</head>

<body>

  <!-- NAV -->
  <div class="nav-tabs">
    <a href="index.html">Space Trucker Tools</a>
    <a href="CargoManifestWriter.html">Cargo Manifest Writer</a>
    <a href="WorkordersOverview.html">Work Orders Overview</a>
    <a href="ProfitSplitter.html">Profit Splitter</a>
    <a href="Yield2Sell.html">Yield 2 Sell</a>
    <a href="Scavenger.html">Scavenger</a>
    <a href="AaronsJumpData.html">Aaron's Jump Data</a>
    <a href="Profile.html">Profile</a>
  </div>

  <!-- CONTENT -->
  <div class="container">
    <h1>Quantum Jump Data — Aaron’s Halo</h1>

    <table id="jumpTable">
      <thead>
        <tr>
          <th>Route</th>
          <th>Distance (mil km)</th>
          <th>Reverse</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- DATA -->
  <script src="JumpData.js"></script>

  <!-- LOGIC -->
  <script>
    const tbody = document.querySelector("#jumpTable tbody");

    function populateTable() {
      tbody.innerHTML = "";

      for (const system in JumpData) {
        const systemRow = document.createElement("tr");
        systemRow.className = "system-row";
        systemRow.innerHTML = `<td colspan="3">${system}</td>`;
        tbody.appendChild(systemRow);

        for (const start in JumpData[system]) {
          const startRow = document.createElement("tr");
          startRow.className = "start-row";
          startRow.innerHTML = `<td colspan="3">${start}</td>`;
          tbody.appendChild(startRow);

          for (const end in JumpData[system][start]) {
            const jump = JumpData[system][start][end];

            const jumpRow = document.createElement("tr");
            jumpRow.className = "jump-row";
            jumpRow.innerHTML = `
              <td><span class="arrow">→</span>${end}</td>
              <td class="highlight">${jump.distance ?? ""}</td>
              <td>${jump.reverse ?? ""}</td>
            `;
            tbody.appendChild(jumpRow);
          }
        }
      }
    }

    populateTable();

    // Active tab highlight
    const currentPage = location.pathname.split("/").pop();
    document.querySelectorAll(".nav-tabs a").forEach(link => {
      if (link.getAttribute("href") === currentPage) {
        link.classList.add("active");
      }
    });
  </script>

</body>
</html>
